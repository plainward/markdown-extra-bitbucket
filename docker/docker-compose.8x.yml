services:
  bitbucket8:
    image: atlassian/bitbucket:8.19.28
    container_name: bitbucket-8
    depends_on:
      db8:
        condition: service_healthy
    ports:
      - "7993:7990"    # HTTP — отдельный порт от 9.6 (7990) и 10.2 (7991)
      - "7996:7999"    # SSH
      - "5009:5005"    # Debug
    volumes:
      - /mnt/ramdisk/bitbucket-data-8:/var/atlassian/application-data/bitbucket
    environment:
      - JDBC_DRIVER=org.postgresql.Driver
      - JDBC_URL=jdbc:postgresql://db8:5432/bitbucket
      - JDBC_USER=bitbucket
      - JDBC_PASSWORD=bitbucket
      - JVM_MINIMUM_MEMORY=1g
      - JVM_MAXIMUM_MEMORY=4g
      - JVM_SUPPORT_RECOMMENDED_ARGS=-Dupm.plugin.upload.enabled=true -Dmarkdownx.dev.mode=true -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7990/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  db8:
    image: postgres:15.8
    container_name: bitbucket-8-postgres
    volumes:
      - pgdata8:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=bitbucket
      - POSTGRES_PASSWORD=bitbucket
      - POSTGRES_DB=bitbucket
      - POSTGRES_ENCODING=UTF8
      - POSTGRES_COLLATE=C
      - POSTGRES_COLLATE_TYPE=C
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitbucket -d bitbucket"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata8:
